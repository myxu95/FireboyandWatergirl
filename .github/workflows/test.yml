name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The supervisor reads /proc, so tests need Linux.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      # Tests against the real claude/codex CLIs skip themselves without FWB_REAL_CLI=1.
      - run: python -m pytest -q
